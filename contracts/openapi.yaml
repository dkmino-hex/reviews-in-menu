openapi: "3.1.0"
info:
  title: "Reviews in menu API"
  version: "0.2.0"
servers: [{"url":"/api/v1"}]
paths:
  "/health":
    get:
      operationId: "getHealth"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  status:
                    const: "ok"
                required: ["status"]
        default:
          description: "Ошибка запроса"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/categories":
    get:
      operationId: "listCategories"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/Category"
        default:
          description: "Ошибка запроса"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/dishes":
    get:
      operationId: "listDishes"
      parameters: [{"name":"q","in":"query","required":false,"schema":{"type":"string"}},{"name":"category","in":"query","required":false,"schema":{"type":"integer","minimum":1}},{"name":"page","in":"query","required":false,"schema":{"type":"integer","minimum":1}}]
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  items:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/Dish"
                  has_more:
                    type: "boolean"
                required: ["items","has_more"]
        default:
          description: "Ошибка запроса"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/dishes/{id}":
    get:
      operationId: "getDish"
      parameters: [{"name":"id","in":"path","required":true,"schema":{"type":"integer","minimum":1}}]
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Dish"
        default:
          description: "Ошибка запроса"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/dishes/{id}/reviews":
    get:
      operationId: listDishReviews
      parameters: [{"name":"id","in":"path","required":true,"schema":{"type":"integer","minimum":1}},{"name":"page","in":"query","schema":{"type":"integer","minimum":1,"maximum":10000,"default":1}}]
      responses:
        "200":
          description: "Страница отзывов"
          content:
            application/json:
              schema:
                type: "object"
                required: ["items","has_more"]
                properties:
                  items:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/Review"
                  has_more:
                    type: "boolean"
        "400":
          description: "Некорректная страница"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Блюдо не найдено"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: "createReview"
      security: [{"session":[]}]
      parameters: [{"name":"id","in":"path","required":true,"schema":{"type":"integer","minimum":1}}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                rating:
                  type: "integer"
                  minimum: 1
                  maximum: 5
                body:
                  type: "string"
                  maxLength: 3000
              required: ["rating"]
              additionalProperties: false
      responses:
        "201":
          description: "Отзыв создан"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  id:
                    type: "integer"
                    minimum: 1
                required: ["id"]
        "400":
          description: "Некорректная оценка или комментарий"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Требуется действующий сеанс"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Отзывы могут оставлять только посетители"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Блюдо не найдено"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Есть действующий отзыв или действует ограничение модерации"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        default:
          description: "Ошибка запроса"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/me/reviews":
    get:
      operationId: listMyReviews
      security: [{"session":[]}]
      parameters: [{"name":"page","in":"query","schema":{"type":"integer","minimum":1,"maximum":10000,"default":1}}]
      responses:
        "200":
          description: "Страница отзывов"
          content:
            application/json:
              schema:
                type: "object"
                required: ["items","has_more"]
                properties:
                  items:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/ManagedReview"
                  has_more:
                    type: "boolean"
        "400":
          description: "Некорректные данные"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Требуется действующий сеанс"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Недостаточно прав"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/me/reviews/{id}":
    patch:
      operationId: editMyReview
      security: [{"session":[]}]
      parameters: [{"name":"id","in":"path","required":true,"schema":{"type":"integer","minimum":1}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewChange"
      responses:
        "204":
          description: "Отзыв изменён"
        "400":
          description: "Некорректные данные"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Требуется действующий сеанс"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Недостаточно прав"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Отзыв не найден"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Версия устарела или действие недоступно в текущем состоянии"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteMyReview
      security: [{"session":[]}]
      parameters: [{"name":"id","in":"path","required":true,"schema":{"type":"integer","minimum":1}}]
      responses:
        "204":
          description: "Отзыв удалён"
        "400":
          description: "Некорректные данные"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Требуется действующий сеанс"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Недостаточно прав"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Отзыв не найден"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/me/reviews/{id}/replace":
    post:
      operationId: replaceMyReview
      security: [{"session":[]}]
      parameters: [{"name":"id","in":"path","required":true,"schema":{"type":"integer","minimum":1}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewChange"
      responses:
        "201":
          description: "Новый отзыв создан, прежний перенесён в архив"
          content:
            application/json:
              schema:
                type: "object"
                required: ["id"]
                properties:
                  id: {type: "integer", minimum: 1}
        "400":
          description: "Некорректные данные"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Требуется действующий сеанс"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Недостаточно прав"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Отзыв не найден"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Версия устарела или действие недоступно в текущем состоянии"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/admin/rating-analytics":
    get:
      operationId: "getRatingAnalytics"
      security: [{"session":[]}]
      description: "Статистика по действующим опубликованным отзывам. Границы дат включительны в часовом поясе Europe/Moscow. Максимум 366 календарных дней."
      parameters:
        - {name: "from", in: "query", required: true, schema: {type: "string", format: "date"}}
        - {name: "to", in: "query", required: true, schema: {type: "string", format: "date"}}
        - {name: "category", in: "query", schema: {type: "integer", minimum: 1}}
        - {name: "dish", in: "query", schema: {type: "integer", minimum: 1}}
        - {name: "group", in: "query", schema: {enum: ["day","week","month"], default: "day"}}
      responses:
        "200":
          description: "Оценки за выбранный период"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingAnalytics"
        "400": {description: "Неверные фильтры"}
        "401": {description: "Требуется действующий сеанс"}
        "403": {description: "Доступно администратору"}
  "/admin/reviews":
    get:
      operationId: listModerationReviews
      security: [{"session":[]}]
      parameters: [{"name":"page","in":"query","schema":{"type":"integer","minimum":1,"maximum":10000,"default":1}}]
      responses:
        "200":
          description: "Страница отзывов"
          content:
            application/json:
              schema:
                type: "object"
                required: ["items","has_more"]
                properties:
                  items:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/ManagedReview"
                  has_more:
                    type: "boolean"
        "400":
          description: "Некорректные данные"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Требуется действующий сеанс"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Недостаточно прав"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/admin/reviews/{id}":
    patch:
      operationId: moderateReview
      security: [{"session":[]}]
      parameters: [{"name":"id","in":"path","required":true,"schema":{"type":"integer","minimum":1}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewModeration"
      responses:
        "204":
          description: "Решение сохранено в журнале"
        "400":
          description: "Некорректные данные"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Требуется действующий сеанс"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Недостаточно прав"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Отзыв не найден"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Версия устарела или действие недоступно в текущем состоянии"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/photos/{key}":
    get:
      operationId: "getPhoto"
      parameters: [{"name":"key","in":"path","required":true,"schema":{"type":"string"}}]
      responses:
        "200":
          description: "Фотография"
          content:
            "image/jpeg": {}
            "image/png": {}
        default:
          description: "Ошибка запроса"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/auth/register":
    post:
      operationId: "register"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                login:
                  type: "string"
                name:
                  type: "string"
                password:
                  type: "string"
              required: ["login","name","password"]
      responses:
        "201":
          description: "Успешный ответ"
        default:
          description: "Ошибка запроса"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/auth/login":
    post:
      operationId: "login"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                login:
                  type: "string"
                password:
                  type: "string"
              required: ["login","password"]
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/User"
        default:
          description: "Ошибка запроса"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/auth/logout":
    post:
      operationId: "logout"
      security: [{"session":[]}]
      responses:
        "204":
          description: "Успешный ответ"
        default:
          description: "Ошибка запроса"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/me":
    get:
      operationId: "getProfile"
      security: [{"session":[]}]
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/User"
        default:
          description: "Ошибка запроса"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      operationId: "updateProfile"
      security: [{"session":[]}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                currentPassword:
                  type: "string"
                newPassword:
                  type: "string"
              required: ["name"]
      responses:
        "204":
          description: "Успешный ответ"
        default:
          description: "Ошибка запроса"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/admin/categories":
    post:
      operationId: "createcategories"
      security: [{"session":[]}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
              required: ["name"]
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Category"
        default:
          description: "Ошибка запроса"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/admin/categories/{id}":
    put:
      operationId: "updatecategories"
      parameters: [{"name":"id","in":"path","required":true,"schema":{"type":"integer","minimum":1}}]
      security: [{"session":[]}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
              required: ["name"]
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Category"
        default:
          description: "Ошибка запроса"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/admin/dishes":
    post:
      operationId: "createdishes"
      security: [{"session":[]}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/DishInput"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  id:
                    type: "integer"
                    minimum: 1
                required: ["id"]
        default:
          description: "Ошибка запроса"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/admin/dishes/{id}":
    put:
      operationId: "updatedishes"
      parameters: [{"name":"id","in":"path","required":true,"schema":{"type":"integer","minimum":1}}]
      security: [{"session":[]}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/DishInput"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  id:
                    type: "integer"
                    minimum: 1
                required: ["id"]
        default:
          description: "Ошибка запроса"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/admin/dishes/{id}/photo":
    put:
      operationId: "uploadPhoto"
      parameters: [{"name":"id","in":"path","required":true,"schema":{"type":"integer","minimum":1}}]
      security: [{"session":[]}]
      requestBody:
        required: true
        content:
          "image/jpeg": {}
          "image/png": {}
      responses:
        "204":
          description: "Успешный ответ"
        default:
          description: "Ошибка запроса"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    delete:
      operationId: "removePhoto"
      parameters: [{"name":"id","in":"path","required":true,"schema":{"type":"integer","minimum":1}}]
      security: [{"session":[]}]
      responses:
        "204":
          description: "Успешный ответ"
        default:
          description: "Ошибка запроса"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/admin/visitors":
    get:
      operationId: "listVisitors"
      parameters: [{"name":"page","in":"query","required":false,"schema":{"type":"integer","minimum":1}}]
      security: [{"session":[]}]
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  items:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/Visitor"
                  has_more:
                    type: "boolean"
                required: ["items","has_more"]
        default:
          description: "Ошибка запроса"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/admin/visitors/{id}":
    patch:
      operationId: "setVisitorBlocked"
      parameters: [{"name":"id","in":"path","required":true,"schema":{"type":"integer","minimum":1}}]
      security: [{"session":[]}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                blocked:
                  type: "boolean"
                reason:
                  type: "string"
              required: ["blocked","reason"]
      responses:
        "204":
          description: "Успешный ответ"
        default:
          description: "Ошибка запроса"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/admin/audit":
    get:
      operationId: "listAudit"
      parameters: [{"name":"page","in":"query","required":false,"schema":{"type":"integer","minimum":1}},{"name":"entity","in":"query","required":false,"schema":{"type":"string"}},{"name":"since","in":"query","required":false,"schema":{"type":"string","format":"date"}}]
      security: [{"session":[]}]
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  items:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/AuditEvent"
                  has_more:
                    type: "boolean"
                required: ["items","has_more"]
        default:
          description: "Ошибка запроса"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
components:
  securitySchemes:
    session:
      type: "apiKey"
      in: "cookie"
      name: "reviews_session"
  schemas:
    RatingAggregate:
      type: "object"
      required: ["average_rating","rating_count"]
      properties:
        average_rating: {type: ["number","null"], minimum: 1, maximum: 5}
        rating_count: {type: "integer", minimum: 0}
    RatingAnalytics:
      allOf:
        - $ref: "#/components/schemas/RatingAggregate"
        - type: "object"
          required: ["dish_options","dishes","timeline"]
          properties:
            dish_options:
              type: "array"
              description: "Справочник блюд для фильтра"
              items:
                type: "object"
                required: ["id","name","category_id"]
                properties:
                  id: {type: "integer", minimum: 1}
                  name: {type: "string"}
                  category_id: {type: "integer", minimum: 1}
            dishes:
              type: "array"
              items:
                allOf:
                  - $ref: "#/components/schemas/RatingAggregate"
                  - type: "object"
                    required: ["id","name"]
                    properties:
                      id: {type: "integer", minimum: 1}
                      name: {type: "string"}
            timeline:
              type: "array"
              items:
                allOf:
                  - $ref: "#/components/schemas/RatingAggregate"
                  - type: "object"
                    required: ["period"]
                    properties:
                      period: {type: "string", format: "date", description: "Начало дня, недели (понедельник) или месяца"}
    Review:
      type: "object"
      required: ["id","rating","body","created_at"]
      properties:
        id: {type: "integer", minimum: 1}
        rating: {type: "integer", minimum: 1, maximum: 5}
        body: {type: "string"}
        created_at: {type: "string", format: "date-time"}
        tone:
          enum: ["positive","negative","neutral","mixed",null]
          description: "Учебная тональность опубликованного комментария, если он размечен"
    ManagedReview:
      allOf:
        - $ref: "#/components/schemas/Review"
        - type: "object"
          required: ["dish_id","dish_name","publication_state","version","moderation_reason","archived_at"]
          properties:
            dish_id: {type: "integer", minimum: 1}
            dish_name: {type: "string"}
            publication_state: {enum: ["published","hidden","archived"]}
            version: {type: "integer", minimum: 1}
            moderation_reason: {type: ["string","null"]}
            archived_at: {type: ["string","null"], format: "date-time"}
    ReviewChange:
      type: "object"
      additionalProperties: false
      required: ["rating","version"]
      properties:
        rating: {type: "integer", minimum: 1, maximum: 5}
        body: {type: "string", maxLength: 3000}
        version: {type: "integer", minimum: 1}
    ReviewModeration:
      type: "object"
      additionalProperties: false
      required: ["action","version"]
      properties:
        action: {enum: ["hide","restore","remove"]}
        reason: {type: "string", maxLength: 300, description: "Обязательная причина для скрытия"}
        version: {type: "integer", minimum: 1}
      if:
        properties:
          action: {const: "hide"}
      then:
        required: ["reason"]
        properties:
          reason: {minLength: 1}
    Error:
      type: "object"
      properties:
        error:
          type: "string"
      required: ["error"]
    Category:
      type: "object"
      properties:
        id:
          type: "integer"
          minimum: 1
        name:
          type: "string"
      required: ["id","name"]
    DishInput:
      type: "object"
      properties:
        category_id:
          type: "integer"
          minimum: 1
        name:
          type: "string"
        description:
          type: "string"
        ingredients:
          type: "string"
        price:
          type: "string"
        portion:
          type: ["string","null"]
        unit:
          enum: ["g","ml",null]
        aliases:
          type: "array"
          items:
            type: "string"
      required: ["category_id","name","price"]
    Dish:
      type: "object"
      properties:
        category_id:
          type: "integer"
          minimum: 1
        name:
          type: "string"
        description:
          type: "string"
        ingredients:
          type: "string"
        price:
          type: "string"
        portion:
          type: ["string","null"]
        unit:
          enum: ["g","ml",null]
        aliases:
          type: "array"
          items:
            type: "string"
        id:
          type: "integer"
          minimum: 1
        photo:
          type: ["string","null"]
        average_rating:
          type: ["number","null"]
          minimum: 1
          maximum: 5
        rating_count:
          type: "integer"
          minimum: 0
        review_excerpt:
          type: ["string","null"]
          description: "Фрагмент последнего опубликованного комментария к блюду"
        opinions:
          type: "object"
          description: "Учебная сводка по опубликованным комментариям за 30 календарных дней"
          required: ["sample","tones","highlights"]
          properties:
            sample: {type: "integer", minimum: 0}
            tones:
              type: "object"
              propertyNames: {enum: ["positive","negative","neutral","mixed"]}
              additionalProperties: {type: "integer", minimum: 1}
            highlights:
              type: "array"
              items:
                type: "object"
                required: ["label","tone","count"]
                properties:
                  label: {type: "string"}
                  tone: {enum: ["positive","negative","neutral"]}
                  count: {type: "integer", minimum: 1}
      required: ["category_id","name","description","ingredients","price","portion","unit","aliases","id","photo","average_rating","rating_count","review_excerpt","opinions"]
    User:
      type: "object"
      properties:
        id:
          type: "integer"
          minimum: 1
        login:
          type: "string"
        name:
          type: "string"
        role:
          enum: ["visitor","admin"]
      required: ["id","login","name","role"]
    Visitor:
      type: "object"
      properties:
        id:
          type: "integer"
          minimum: 1
        login:
          type: "string"
        name:
          type: "string"
        role:
          enum: ["visitor","admin"]
        blocked:
          type: "boolean"
      required: ["id","login","name","role","blocked"]
    AuditEvent:
      type: "object"
      properties:
        id:
          type: "integer"
          minimum: 1
        actor_id:
          type: "integer"
          minimum: 1
        action:
          type: "string"
        entity_type:
          type: "string"
        entity_id:
          type: "integer"
          minimum: 1
        details:
          type: "object"
        created_at:
          type: "string"
          format: "date-time"
      required: ["id","actor_id","action","entity_type","entity_id","details","created_at"]
